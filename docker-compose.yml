services:
  # Serveur web : PHP 8.3 + Apache, construit depuis notre Dockerfile
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Base de données PostgreSQL 16
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Faux serveur de mails : capture les envois de PHP
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
